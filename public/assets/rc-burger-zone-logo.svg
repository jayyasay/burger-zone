<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">RC Burger Zone Logo</title>
  <desc id="desc">Circular orange badge with green diamond, burger illustration, and Burger Zone RC lettering.</desc>
  <defs>
    <linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="55%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#dfdfdf"/>
    </linearGradient>
    <linearGradient id="bunBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f7f7"/>
      <stop offset="100%" stop-color="#b7b7b7"/>
    </linearGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35312d"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".18"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="246" fill="#f8b344"/>
  <rect x="112" y="112" width="288" height="288" rx="22" transform="rotate(45 256 256)" fill="#98c83f"/>

  <g filter="url(#softShadow)">
    <path d="M187 108c17-31 48-49 89-49 42 0 76 19 98 55 5 8 3 18-4 23-25 17-66 29-122 29-27 0-54-3-75-11-8-3-12-13-8-21 7-9 14-18 22-26z" fill="url(#bunTop)"/>
    <ellipse cx="258" cy="175" rx="90" ry="18" fill="url(#patty)"/>
    <path d="M170 187c11 6 23 9 37 9 16 0 34-5 52-15 8-5 18-4 26 2 14 10 28 13 43 13 13 0 25-2 37-7 10-4 21 4 19 15-5 33-45 56-106 56-60 0-99-24-120-54-6-8-1-20 12-19z" fill="url(#patty)"/>
    <path d="M181 228c14 8 28 12 43 12 19 0 39-7 58-20 5-4 12-4 18 0 18 12 38 19 58 19 11 0 22-2 34-6 6-2 12 2 13 8 3 12-3 25-17 37-22 19-58 31-100 31-44 0-84-15-106-39-10-11-14-23-11-33 2-7 10-11 16-9 0 0 0 0 0 0z" fill="url(#bunBottom)"/>
  </g>

  <g fill="#ffffff">
    <circle cx="206" cy="108" r="5"/>
    <circle cx="231" cy="95" r="5"/>
    <circle cx="259" cy="90" r="5"/>
    <circle cx="289" cy="93" r="5"/>
    <circle cx="317" cy="103" r="5"/>
    <circle cx="342" cy="118" r="5"/>
    <circle cx="185" cy="126" r="5"/>
    <circle cx="219" cy="121" r="5"/>
    <circle cx="246" cy="112" r="5"/>
    <circle cx="274" cy="114" r="5"/>
    <circle cx="302" cy="122" r="5"/>
    <circle cx="329" cy="132" r="5"/>
  </g>

  <rect x="94" y="203" width="324" height="8" fill="#1d1a15"/>
  <rect x="94" y="412" width="324" height="8" fill="#1d1a15"/>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="256" y="325" font-size="100" letter-spacing="-4">BURGER</text>
    <text x="256" y="398" font-size="112" letter-spacing="-6">ZONE</text>
    <text x="256" y="470" font-size="38" font-weight="500">RC</text>
  </g>
</svg>
